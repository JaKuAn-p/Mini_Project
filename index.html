<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Smart Calendar & Tamagotchi Sync</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📅 ตารางเวลาติว (Calendar View)</h1>
        
        <!-- ส่วนปฏิทินจำลอง -->
        <div class="calendar-card">
            <h2>สิงหาคม 2026</h2>
            <div class="calendar-grid">
                <div class="day-header">อา</div>
                <div class="day-header">จ</div>
                <div class="day-header">อ</div>
                <div class="day-header">พ</div>
                <div class="day-header">พฤ</div>
                <div class="day-header">ศ</div>
                <div class="day-header">ส</div>
                
                <!-- วันที่จำลอง -->
                <div class="day">17</div>
                <div class="day">18</div>
                <div class="day active" onclick="openDetail('19 สิงหาคม', '18:00 - 19:00 น. : ติวคณิตศาสตร์')">
                    19 <span class="badge">คณิต</span>
                </div>
                <div class="day active" onclick="openDetail('20 สิงหาคม', '19:00 - 20:00 น. : ติวภาษาอังกฤษ')">
                    20 <span class="badge eng">อังกฤษ</span>
                </div>
                <div class="day">21</div>
                <div class="day">22</div>
                <div class="day">23</div>
            </div>
        </div>

        <!-- หน้าต่างป๊อปอัป (Modal) แสดงรายละเอียดเวลา -->
        <div id="detailModal" class="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeDetail()">&times;</span>
                <h3 id="modalDate">รายละเอียดวันที่</h3>
                <div id="modalTimeSlots" class="time-slot-box"></div>
                <button class="checkin-btn" onclick="addScore(50)">✅ เช็กอินติวเสร็จ (+50 แต้ม)</button>
            </div>
        </div>

        <div class="score-board">
            <p>คะแนน Tamagotchi: <span id="score">0</span> แต้ม</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
