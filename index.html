<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Smart Schedule & Tamagotchi Sync</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⏰ ระบบจัดตารางเวลาติว + สะสมแต้ม</h1>
        
        <!-- ส่วนที่ 1: กรอกข้อมูล -->
        <div class="card">
            <h2>1. กรอกข้อมูลประจำวัน & เป้าหมาย</h2>
            <label>เวลานอน (ชม./วัน):</label>
            <input type="number" id="sleepTime" value="8">
            
            <label>เวลาเรียน/ทำงาน (ชม./วัน):</label>
            <input type="number" id="workTime" value="8">
            
            <label>วิชาที่สนใจ:</label>
            <select id="subject">
                <option value="คณิตศาสตร์">คณิตศาสตร์</option>
                <option value="ภาษาอังกฤษ">ภาษาอังกฤษ</option>
                <option value="ฟิสิกส์">ฟิสิกส์</option>
            </select>
            
            <label>เป้าหมายต้องจบใน (วัน):</label>
            <input type="number" id="targetDays" value="10">
            
            <button onclick="generateSchedule()">คำนวณตารางเวลา</button>
        </div>

        <!-- ส่วนที่ 2: แสดงตารางเวลา -->
        <div class="card">
            <h2>2. ตารางเวลาของคุณ</h2>
            <div id="scheduleResult">กรอกข้อมูลแล้วกดคำนวณ...</div>
        </div>

        <!-- ส่วนที่ 3: จำลองการเก็บแต้ม -->
        <div class="card score-board">
            <h2>3. สถานะ Tamagotchi</h2>
            <p>คะแนนสะสม: <span id="score">0</span> แต้ม</p>
            <button onclick="addScore(50)">✅ เรียนเสร็จแล้ว (+50 แต้ม)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
