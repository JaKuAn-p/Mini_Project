<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Smart Schedule & Tamagotchi Sync</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⏰ ระบบจัดตารางเวลาติว + ปฏิทินตลอดปี</h1>
        
        <!-- ส่วนที่ 1: กรอกข้อมูล -->
        <div class="card">
            <h2>1. กรอกข้อมูลประจำวัน & เป้าหมาย</h2>
            <label>เวลานอน (ชม./วัน):</label>
            <input type="number" id="sleepTime" value="8">
            
            <label>เวลาเรียน/ทำงาน (ชม./วัน):</label>
            <input type="number" id="workTime" value="8">
            
            <label>วิชาที่สนใจ:</label>
            <select id="subject">
                <option value="คณิตศาสตร์">คณิตศาสตร์</option>
                <option value="ภาษาอังกฤษ">ภาษาอังกฤษ</option>
                <option value="ฟิสิกส์">ฟิสิกส์</option>
            </select>
            
            <label>เป้าหมายต้องจบใน (วัน):</label>
            <input type="number" id="targetDays" value="30">
            
            <button onclick="generateSchedule()">คำนวณและสร้างปฏิทิน</button>
        </div>

        <!-- ส่วนที่ 2: แสดงปฏิทินแบบเปลี่ยนเดือนได้ -->
        <div class="card">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">❮ เดือนก่อนหน้า</button>
                <h2 id="currentMonthYear">มกราคม 2026</h2>
                <button onclick="changeMonth(1)">เดือนถัดไป ❯</button>
            </div>
            
            <div class="calendar-grid" id="calendarGrid">
                <!-- วันในปฏิทินจะถูกสร้างจาก JavaScript -->
            </div>
        </div>

        <!-- ส่วนที่ 3: สถานะ Tamagotchi -->
        <div class="card score-board">
            <h2>3. สถานะ Tamagotchi</h2>
            <p>คะแนนสะสม: <span id="score">0</span> แต้ม</p>
        </div>
    </div>

    <!-- หน้าต่าง Pop-up แสดงรายละเอียดเมื่อกดเลือกวัน -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDetail()">&times;</span>
            <h3 id="modalDate">รายละเอียดวันที่</h3>
            <div id="modalTimeSlots" class="time-slot-box"></div>
            <button class="checkin-btn" onclick="addScore(50)">✅ เรียนเสร็จแล้ว (+50 แต้ม)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
